<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prosta aplikacja To-Do List do zarządzania codziennymi zadaniami">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Moja lista zadań</h1>
            <p>Dodawaj i zarządzaj swoimi zadaniami</p>
        </header>

        <form id="taskForm">
            <label for="taskInput" class="visually-hidden">Nowe zadanie</label>
            <input
                type="text"
                id="taskInput"
                placeholder="Wpisz nowe zadanie..."
                maxlength="100"
                autocomplete="off"
                required
            >
            <button type="submit">Dodaj</button>
        </form>

        <ul id="taskList" aria-label="Lista zadań"></ul>
    </main>

    <footer class="footer">
        <p class="team">
            <span>Heorhi Kheladze</span>
            <span>Fedir Lisnychenko</span>
            <span>Ivan Maliuk</span>
            <span>Vladyslav Pankratov</span>
        </p>
        <p>To-Do List &copy; 2026 – projekt zespołowy</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
